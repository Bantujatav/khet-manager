<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f7d45">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Khet Manager">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Khet Manager</title>
  <style>
    :root{
      --bg:#f5f7f1;--panel:#ffffff;--panel-soft:#eef5e9;--ink:#1f2a22;
      --muted:#667168;--line:#dbe3d7;--green:#2f7d45;--green-dark:#205a31;
      --gold:#a66f16;--red:#b42318;--red-soft:#fff0ee;
      --shadow:0 14px 36px rgba(38,57,38,.10);--radius:8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
      background:linear-gradient(135deg,rgba(47,125,69,.08),transparent 32%),
        radial-gradient(circle at right top,rgba(166,111,22,.09),transparent 28%),var(--bg);
      color:var(--ink);}
    button,input,select,textarea{font:inherit}button{color:inherit}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    .app-shell{width:min(1180px,100%);min-height:100vh;margin:0 auto;padding:18px;}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 2px 16px;}
    .brand{display:flex;align-items:center;gap:12px;min-width:0;}
    .brand-mark{width:42px;height:42px;border-radius:8px;background:linear-gradient(145deg,#2f7d45,#83a857);
      display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 10px 24px rgba(47,125,69,.22);flex:0 0 auto;}
    .brand h1{font-size:22px;font-weight:750;}
    .brand p{font-size:13px;color:var(--muted);margin-top:3px}
    .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .status-pill{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:7px 11px;
      border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.72);
      color:var(--muted);font-size:13px;white-space:nowrap;cursor:pointer;}
    .status-pill:hover{background:rgba(255,255,255,.95)}
    .install-btn{display:none;align-items:center;gap:8px;min-height:34px;border:1px solid #b8d2ad;
      border-radius:999px;background:#eaf4e4;color:var(--green-dark);padding:7px 11px;
      font-size:13px;font-weight:800;cursor:pointer;}
    .sdot{width:8px;height:8px;border-radius:50%;background:#d39b20;flex:0 0 auto;transition:background .3s}
    .offline-banner{display:none;background:#fff3cd;border:1px solid #ffd97d;border-radius:var(--radius);
      padding:10px 14px;font-size:13px;color:#664d03;margin-bottom:12px;gap:8px;align-items:center;}
    .offline-banner.show{display:flex}
    .layout{display:grid;grid-template-columns:286px minmax(0,1fr);gap:16px;min-height:680px;}
    .sidebar,.main{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
    .sidebar{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;}
    .side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .side-title{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .plot-count{font-size:12px;color:var(--green-dark);background:var(--panel-soft);border:1px solid #d5e6cd;border-radius:999px;padding:4px 8px;}
    .search{width:100%;min-height:38px;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;background:#fbfcfa;color:var(--ink);font-size:14px;}
    .search:focus,.ipt:focus{outline:3px solid rgba(47,125,69,.14);border-color:var(--green);}
    #plot-list{display:flex;flex-direction:column;gap:7px;min-height:120px;overflow:auto;padding-right:2px;}
    .pb{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:10px;
      border:1px solid transparent;background:transparent;border-radius:var(--radius);padding:8px;cursor:pointer;text-align:left;}
    .pb:hover{background:#f3f7f0;border-color:#e1ebdc}
    .pb.active{background:#eaf4e4;border-color:#bad2ad}
    .plot-avatar{width:34px;height:34px;border-radius:8px;background:#dcebcf;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--green-dark);}
    .plot-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .plot-meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
    .side-spacer{flex:1;min-height:16px}
    .add-btn,.primary-btn,.ghost-btn,.danger-btn,.tab,.del-btn{border-radius:var(--radius);cursor:pointer;min-height:36px;transition:background .15s,border-color .15s;}
    .add-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
      border:1px dashed #9fba92;background:#f7fbf4;color:var(--green-dark);font-size:14px;font-weight:700;padding:9px 12px;}
    .add-btn:hover{background:#eef7ea}
    .main{padding:18px;overflow:auto;min-width:0;}
    .mobile-back{display:none;align-items:center;gap:8px;background:transparent;border:0;color:var(--green-dark);font-size:14px;font-weight:750;margin-bottom:14px;padding:4px 0;cursor:pointer;}
    .empty-state{min-height:530px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;color:var(--muted);}
    .empty-icon{width:86px;height:86px;border-radius:24px;background:linear-gradient(145deg,#edf7e8,#fff);border:1px solid var(--line);display:grid;place-items:center;font-size:36px;}
    .empty-state strong{font-size:18px;color:var(--ink)}
    .plot-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;}
    .plot-title-wrap{display:flex;gap:12px;align-items:center;min-width:0}
    .pv-badge{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;background:#e1efda;color:var(--green-dark);font-weight:800;flex:0 0 auto;font-size:20px;}
    #pv-title{font-size:24px;line-height:1.15;font-weight:800;overflow-wrap:anywhere}
    #pv-meta{font-size:13px;color:var(--muted);margin-top:4px}
    .header-btns{display:flex;gap:8px;flex-wrap:wrap;}
    .danger-btn{border:1px solid #f0c1bb;background:#fff7f6;color:var(--red);padding:8px 11px;font-size:13px;font-weight:750;white-space:nowrap;}
    .danger-btn:hover{background:var(--red-soft)}
    .export-btn{border:1px solid #d5e6cd;background:#f0f9eb;color:var(--green-dark);padding:8px 11px;font-size:13px;font-weight:750;white-space:nowrap;border-radius:var(--radius);cursor:pointer;}
    .export-btn:hover{background:#e4f4da}
    .summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;}
    .metric{background:#fbfcfa;border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-width:0;}
    .metric span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    .metric strong{font-size:18px;line-height:1.1;overflow-wrap:anywhere}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px;}
    .tab{border:1px solid transparent;background:transparent;padding:7px 11px;color:var(--muted);font-size:13px;font-weight:750;}
    .tab:hover{background:#f3f7f0}
    .tab.active{background:var(--green);border-color:var(--green);color:#fff}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;}
    .shdr{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--green-dark)}
    .hint{font-size:12px;color:var(--muted)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    .fr{display:flex;flex-direction:column;gap:6px;min-width:0;}
    .fl{font-size:13px;color:var(--muted);font-weight:700}
    .ipt{width:100%;min-height:40px;border:1px solid var(--line);border-radius:var(--radius);background:#fbfcfa;color:var(--ink);padding:8px 10px;font-size:14px;}
    textarea.ipt{min-height:80px;resize:vertical;line-height:1.5}
    .table-head,.act-grid-row,.cost-grid-row{display:grid;gap:8px;align-items:center;}
    .act-grid-row{grid-template-columns:minmax(160px,1fr) 140px 110px 36px}
    .cost-grid-row{grid-template-columns:minmax(160px,1fr) 140px 36px}
    .table-head{padding:0 0 8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
    .row-item{padding:8px 0;border-bottom:1px solid #edf1ea;}
    .del-btn{border:0;background:transparent;color:var(--muted);min-width:36px;padding:0;font-size:18px;line-height:1;}
    .del-btn:hover{background:var(--red-soft);color:var(--red)}
    .empty-row{padding:16px 0;color:var(--muted);font-size:14px}
    .total-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;border-top:1px solid var(--line);margin-top:10px;font-weight:800;}
    #total-exp{color:var(--red);font-size:18px}
    .profit-box{border-radius:var(--radius);padding:18px;margin-top:14px;border:1px solid #c9e0bf;background:#edf8e9;}
    .profit-label{font-size:13px;color:var(--green-dark);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    #profit-val{font-size:34px;font-weight:850;color:var(--green-dark);margin-top:5px}
    #profit-sub{font-size:13px;margin-top:6px;color:var(--green)}
    /* WEATHER */
    .weather-card{background:linear-gradient(135deg,#e8f4fd,#f0f9ff);border:1px solid #b8d9f0;border-radius:var(--radius);padding:14px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
    .weather-main{display:flex;align-items:center;gap:10px;}
    .weather-icon{font-size:40px;line-height:1}
    .weather-temp{font-size:28px;font-weight:800;color:#1a4a6e}
    .weather-desc{font-size:13px;color:#2a6096;margin-top:2px;text-transform:capitalize}
    .weather-details{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#2a5070;margin-top:4px;}
    .weather-details span{display:flex;align-items:center;gap:4px;}
    .weather-location{font-size:12px;color:#5a8ab0;margin-top:2px;}
    .weather-loading{font-size:13px;color:var(--muted);padding:10px 0;}
    .weather-advice{background:#fffde7;border:1px solid #ffe082;border-radius:6px;padding:10px 12px;font-size:13px;color:#5a4500;margin-top:10px;line-height:1.5;}
    /* PHOTOS */
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px;}
    .photo-thumb{position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);cursor:pointer;}
    .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .photo-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:4px;padding:2px 6px;font-size:12px;cursor:pointer;display:none;}
    .photo-thumb:hover .photo-del{display:block}
    .photo-upload-label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1;border:2px dashed #9fba92;border-radius:var(--radius);background:#f7fbf4;color:var(--green-dark);font-size:12px;font-weight:700;cursor:pointer;}
    .photo-upload-label:hover{background:#eef7ea}
    #photo-input{display:none}
    /* DIARY */
    .diary-entry{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:#fbfcfa;}
    .diary-date{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
    .diary-text{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
    .diary-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#e3f0d8;color:var(--green-dark);border:1px solid #c2dba9;margin-right:4px;}
    .diary-tag.warn{background:#fff8e1;color:#7a5c00;border-color:#ffe082}
    .diary-tag.bad{background:var(--red-soft);color:var(--red);border-color:#f0c1bb}
    /* REMINDERS */
    .reminder-item{display:grid;grid-template-columns:minmax(0,1fr) 140px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1ea;}
    .reminder-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;}
    .rbadge-due{background:#fff3cd;color:#7a5500;border:1px solid #ffd97d}
    .rbadge-ok{background:#e8f4e8;color:var(--green-dark);border:1px solid #b8d9b8}
    .rbadge-over{background:var(--red-soft);color:var(--red);border:1px solid #f0c1bb}
    /* MODAL */
    .modal{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:18px;background:rgba(20,30,22,.48);z-index:999;}
    .modal-card{width:400px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 24px 60px rgba(20,30,22,.24);padding:18px;max-height:90vh;overflow-y:auto;}
    .modal-card h2{font-size:19px;margin-bottom:4px}
    .modal-card p{font-size:13px;color:var(--muted);margin-bottom:16px}
    .modal-actions{display:flex;gap:10px;margin-top:16px}
    .primary-btn,.ghost-btn{flex:1;border:1px solid var(--line);padding:9px 12px;font-size:14px;font-weight:800}
    .primary-btn{background:var(--green);border-color:var(--green);color:#fff}
    .primary-btn:hover{background:var(--green-dark)}
    .ghost-btn{background:#fff;color:var(--muted)}
    /* LIGHTBOX */
    .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1100;align-items:center;justify-content:center;}
    .lightbox.open{display:flex}
    .lightbox img{max-width:92vw;max-height:92vh;border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.5);}
    .lightbox-close{position:absolute;top:16px;right:20px;background:transparent;border:0;color:#fff;font-size:28px;cursor:pointer;}
    /* TOAST */
    .sync-toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;border-radius:var(--radius);padding:10px 16px;font-size:13px;z-index:1000;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;}
    .sync-toast.show{opacity:1;transform:translateY(0)}
    /* FARM NOTES SIDEBAR */
    .farm-notes-divider{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--green-dark);}
    .farm-notes-divider::before,.farm-notes-divider::after{content:"";flex:1;height:1px;background:var(--line);}
    .farm-notes-box{background:var(--panel-soft);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;}
    .fn-note{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;position:relative;}
    .fn-note-header{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px;}
    .fn-note-date{font-size:11px;color:var(--muted)}
    .fn-note-tag{font-size:11px;font-weight:700;color:var(--green-dark);background:#e3f0d8;border:1px solid #c2dba9;border-radius:999px;padding:1px 7px;}
    .fn-note-text{font-size:13px;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
    .fn-del{border:0;background:transparent;color:var(--muted);font-size:14px;cursor:pointer;padding:0 2px;line-height:1;flex:0 0 auto;}
    .fn-del:hover{color:var(--red)}
    .fn-input{font-size:13px;min-height:60px;resize:none;}
    .fn-add-btn{min-height:32px;padding:4px 12px;background:var(--green);color:#fff;border:0;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
    .fn-add-btn:hover{background:var(--green-dark)}
    .fn-empty{font-size:12px;color:var(--muted);padding:6px 2px}
    @media(max-width:860px){
      .app-shell{padding:12px}
      .layout{grid-template-columns:1fr}
      .sidebar{min-height:calc(100vh - 94px)}
      .main{display:none;min-height:calc(100vh - 94px)}
      .layout.viewing-detail .sidebar{display:none}
      .layout.viewing-detail .main{display:block}
      .mobile-back{display:inline-flex}
      .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .form-grid{grid-template-columns:1fr}
      .topbar{align-items:flex-start}
      .brand h1{font-size:20px}
    }
    @media(max-width:560px){
      .topbar{flex-direction:column}
      .status-pill{width:100%;justify-content:center}
      .plot-header{flex-direction:column}
      .danger-btn,.export-btn{width:100%}
      #pv-title{font-size:22px}
      .summary-grid{grid-template-columns:1fr}
      .act-grid-row,.cost-grid-row{grid-template-columns:1fr}
      .table-head{display:none}
      .del-btn{justify-self:end}
      .modal-actions{flex-direction:column}
      .ipt{font-size:16px}
      .reminder-item{grid-template-columns:1fr 36px}
    }
  </style>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🌱</div>
      <div>
        <h1>Khet Manager</h1>
        <p>Track plots · costs · harvest · profit</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="install-btn" id="install-btn" onclick="installApp()">📲 Install</button>
      <div class="status-pill" onclick="forceSync()" title="Click to sync">
        <span class="sdot" id="sdot"></span><span id="sstat">Loading...</span>
      </div>
    </div>
  </header>

  <div class="offline-banner" id="offline-banner">⚠️ <span>Offline — changes save locally, sync when reconnected.</span></div>

  <div class="layout" id="layout-container">
    <aside class="sidebar">
      <div class="side-head">
        <div class="side-title">My plots</div>
        <div class="plot-count" id="plot-count">0 plots</div>
      </div>
      <input class="search" id="plot-search" placeholder="Search plots…" oninput="renderSidebar()">
      <div id="plot-list"></div>
      <div class="side-spacer"></div>
      <button class="add-btn" onclick="showModal()">+ Add plot</button>

      <!-- FARM NOTES SECTION -->
      <div class="farm-notes-divider">
        <span>📝 Farm Notes</span>
      </div>
      <div class="farm-notes-box">
        <div id="fn-list"></div>
        <div style="display:grid;gap:8px;margin-top:10px">
          <textarea class="ipt fn-input" id="fn-input" placeholder="Write a general farm note — market visit, mandi price, weather observation, to-do, any idea…" rows="3"></textarea>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <select class="ipt" id="fn-tag" style="min-height:32px;font-size:12px;padding:4px 6px;flex:1">
              <option value="">General</option>
              <option value="📌 To-do">📌 To-do</option>
              <option value="💰 Market">💰 Market</option>
              <option value="☁️ Weather">☁️ Weather</option>
              <option value="🌿 Input purchase">🌿 Input purchase</option>
              <option value="📞 Contact">📞 Contact</option>
            </select>
            <button class="fn-add-btn" onclick="addFarmNote()">+ Add</button>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <button class="mobile-back" onclick="backToList()">&#8592; Back</button>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon">🌾</div>
        <strong>No plots yet</strong>
        <div>Add your first field to begin tracking.</div>
        <button class="add-btn" style="max-width:190px" onclick="showModal()">Add plot</button>
      </div>

      <div id="plot-view" style="display:none">
        <div class="plot-header">
          <div class="plot-title-wrap">
            <div class="pv-badge" id="pv-emoji"></div>
            <div><div id="pv-title"></div><div id="pv-meta"></div></div>
          </div>
          <div class="header-bt
